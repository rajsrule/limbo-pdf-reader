name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: node scripts/notices.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: node scripts/check-export.mjs
      - run: npm run tauri build -- --bundles nsis
      - name: Prepare download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName artifacts/Limbo-Setup.exe
          $digest = (Get-FileHash artifacts/Limbo-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$digest  Limbo-Setup.exe" | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Limbo-Windows-x64
          path: artifacts/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME artifacts/Limbo-Setup.exe artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME artifacts/Limbo-Setup.exe artifacts/SHA256SUMS.txt --title "Limbo $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          }
